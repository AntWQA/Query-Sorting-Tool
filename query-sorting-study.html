<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Query Sorting</title>
<style>
  :root {
    /* doTERRA Pure - Base 1.2.2 tokens */
    --paper: #F6F7F8;
    --paper-raised: #FFFFFF;
    --ink: #354657;
    --muted: rgba(53,70,87,0.64);
    --line: rgba(190,196,201,0.55);
    --line-strong: #BEC4C9;
    --accent: #9D57B2;
    --accent-ink: #FFFFFF;
    --accent-tint: #EADAEE;
    --accent-glow: rgba(157,87,178,0.32);
    --success: #12B76A;
    --success-bg: rgba(18,183,106,0.12);
    --fail: #F04438;
    --fail-bg: rgba(240,68,56,0.12);
    --warn: #F79009;
    --warn-bg: rgba(247,144,9,0.12);
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 16px;
    --shadow: 0 1px 2px rgba(53,70,87,0.08), 0 6px 16px rgba(53,70,87,0.10);
    --font-display: 'Rawline', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-body: 'Rawline', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #1B2430; --paper-raised: #232E3D; --ink: #E7ECEF; --muted: rgba(231,236,239,0.64);
      --line: rgba(190,196,201,0.22); --line-strong: rgba(190,196,201,0.4);
      --accent: #BD8BCA; --accent-ink: #2B1730; --accent-tint: rgba(157,87,178,0.2); --accent-glow: rgba(189,139,202,0.4);
      --success-bg: rgba(18,183,106,0.18); --fail-bg: rgba(240,68,56,0.18); --warn-bg: rgba(247,144,9,0.18);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #1B2430; --paper-raised: #232E3D; --ink: #E7ECEF; --muted: rgba(231,236,239,0.64);
    --line: rgba(190,196,201,0.22); --line-strong: rgba(190,196,201,0.4);
    --accent: #BD8BCA; --accent-ink: #2B1730; --accent-tint: rgba(157,87,178,0.2); --accent-glow: rgba(189,139,202,0.4);
    --success-bg: rgba(18,183,106,0.18); --fail-bg: rgba(240,68,56,0.18); --warn-bg: rgba(247,144,9,0.18);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scrollbar-gutter: stable; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); line-height: 1.45; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  a { color: var(--accent); }
  button, .bucket, input, textarea, select { transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease; }
  @media (prefers-reduced-motion: no-preference) {
    main.phase-enter { animation: rise 0.28s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    button:active { transform: scale(0.98); }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 920px; margin: 0 auto; padding-inline: 20px; }
  .wrap.wide { max-width: 1180px; }
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
  /* One fixed size on every screen: width, height and the logo position never change, only what sits on the right does. */
  .top-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 68px; flex-wrap: nowrap; }
  .brand { display: flex; flex-direction: column; gap: 5px; flex: 0 0 auto; }
  .brand .logo { display: flex; align-items: center; color: var(--ink); }
  .brand .logo svg { display: block; height: 24px; width: auto; }
  .brand h1 { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .top-right { display: flex; align-items: center; gap: 8px; height: 36px; }
  nav.views { display: flex; gap: 6px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  nav.views button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  nav.views button.active { background: var(--ink); color: var(--paper); }
  .icon-btn svg { display: block; }
  .icon-btn { display: flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 34px; height: 34px; border: 1px solid var(--line); background: var(--paper-raised); color: var(--muted); border-radius: 999px; cursor: pointer; padding: 0; font: inherit; font-weight: 700; font-size: 14px; }
  .icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }

  main { padding-block: 28px 80px; }
  h2 { font-family: var(--font-display); font-size: 24px; margin: 0 0 6px; }
  h3 { font-family: var(--font-display); font-size: 16px; margin: 28px 0 8px; }
  p.lede { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
  .card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 16px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .mono { font-family: var(--font-mono); }

  label.field { display: block; margin-bottom: 14px; }
  label.field > span, .field-label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }
  input[type="text"], input[type="number"], textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: 9px 11px; }
  .row select { width: auto; min-width: 170px; }
  textarea { resize: vertical; min-height: 70px; }
  textarea.json { font-family: var(--font-mono); font-size: 12px; min-height: 340px; line-height: 1.4; }
  input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); }
  .check { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 10px; cursor: pointer; }
  .check span { font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row.end { justify-content: flex-end; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1 1 auto; }

  .btn { font: inherit; font-weight: 600; font-size: 14px; border-radius: 999px; padding: 10px 20px; cursor: pointer; border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink); }
  .btn:hover:not(:disabled) { border-color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { box-shadow: 0 0 0 4px var(--accent-glow); }
  .btn.danger { color: var(--fail); border-color: var(--fail); }
  .btn.small { padding: 6px 13px; font-size: 13px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .banner { border-radius: var(--radius-md); padding: 11px 14px; font-size: 14px; margin-bottom: 16px; border: 1px solid var(--line); background: var(--paper-raised); }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn); }
  .banner.fail { background: var(--fail-bg); border-color: var(--fail); }
  .banner.ok { background: var(--success-bg); border-color: var(--success); }
  .banner.info { background: var(--accent-tint); border-color: var(--accent); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 2px 9px; background: var(--paper); border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; }
  .badge.ok { background: var(--success-bg); border-color: var(--success); color: var(--ink); }
  .badge.warn { background: var(--warn-bg); border-color: var(--warn); color: var(--ink); }
  .badge.fail { background: var(--fail-bg); border-color: var(--fail); color: var(--ink); }
  .badge.accent { background: var(--accent-tint); border-color: var(--accent); color: var(--ink); }

  /* ---------- Sorting ---------- */
  .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); }
  .query-card { text-align: center; padding: 34px 20px; margin: 18px 0; }
  .query-label { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .query { font-family: var(--font-display); font-size: 34px; font-weight: 600; overflow-wrap: anywhere; line-height: 1.2; }
  .buckets { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
  .gloss { margin-top: 14px; display: inline-block; text-align: left; background: var(--accent-tint); border: 1px solid var(--accent); border-radius: var(--radius-md); padding: 8px 14px; }
  .gloss .gl-label { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .gloss .gl-text { font-size: 18px; font-weight: 600; }
  .gl-inline { display: block; font-size: 12px; color: var(--muted); }
  .bucket { text-align: left; display: flex; gap: 11px; align-items: flex-start; font: inherit; color: var(--ink); background: var(--paper-raised); border: 1.5px solid var(--line); border-radius: var(--radius-md); padding: 11px 12px; cursor: pointer; }
  .bucket:hover { border-color: var(--line-strong); }
  .bucket.selected { border-color: var(--accent); background: var(--accent-tint); box-shadow: 0 0 0 3px var(--accent-glow); }
  .bucket .code { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .bucket.selected .code { background: var(--accent); color: var(--accent-ink); }
  .bucket .bname { display: block; font-weight: 700; font-size: 14px; }
  .bucket .bdef { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .bucket.none { border-style: dashed; }
  .flags { display: flex; gap: 22px; flex-wrap: wrap; margin: 18px 0 8px; }
  .flags .check { margin: 0; }
  .nav-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; align-items: center; flex-wrap: wrap; }

  /* ---------- Tables ---------- */
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--paper-raised); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); background: var(--paper); position: sticky; top: 0; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--accent-tint); }
  .matrix td, .matrix th { text-align: center; padding: 6px 8px; min-width: 34px; }
  .matrix th.rowh { text-align: left; position: static; }
  .matrix td.diag { font-weight: 700; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 14px 0; }
  .tile { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px; }
  .tile .big { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.1; }
  .tile .cap { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tile .lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
  .session-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .session-row:last-child { border-bottom: 0; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .export-menu-wrap { position: relative; display: inline-flex; }
  .export-menu { position: absolute; top: calc(100% + 6px); right: 0; min-width: 240px; background: var(--paper-raised); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; z-index: 30; display: flex; flex-direction: column; }
  .export-menu button { border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13px; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .export-menu button:hover { background: var(--accent-tint); }
  .shortcuts-panel { position: fixed; right: 20px; top: 70px; z-index: 40; width: 300px; background: var(--paper-raised); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; font-size: 13px; }
  .shortcuts-panel dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 8px 0 0; }
  .shortcuts-panel dt { font-family: var(--font-mono); font-weight: 700; }
  .shortcuts-panel dd { margin: 0; color: var(--muted); }
  details { margin: 10px 0; }
  summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  ul.tight { margin: 6px 0 0; padding-left: 20px; }
  ul.tight li { margin-bottom: 4px; }
  @media (max-width: 640px) { .query { font-size: 26px; } .wrap { padding-inline: 14px; } }
  /* The header cannot wrap (it must keep one height), so on a phone it gets smaller parts instead. */
  @media (max-width: 520px) {
    .top-inner { gap: 8px; }
    .brand h1 { font-size: 10px; letter-spacing: 0.03em; }
    .top-right { gap: 6px; }
    nav.views { gap: 2px; }
    nav.views button { padding: 6px 8px; font-size: 12px; }
    .help-btn { display: none; }
  }
</style>
</head>

    var perB = {};
    parsed.items.forEach(function (it) { if (it.analyst) perB[it.analyst] = (perB[it.analyst] || 0) + 1; });
    var thin = parsed.buckets.filter(function (b) { return (perB[b.code] || 0) < 2; }).map(function (b) { return b.code; });
    if (thin.length) notes.push("Buckets with fewer than 2 draft items, so per-bucket results will say little: " + thin.join(", ") + ".");
    contentError = null; contentWarning = notes.length ? notes.join(" ") : null;
    config = { buckets: parsed.buckets, items: parsed.items, kappaTarget: kt, specificTarget: st, shuffle: shuffleDraft !== false };
    contentVersion = (contentVersion || 0) + 1;
    contentUpdatedAt = new Date().toISOString();
    contentDraft = null; kDraft = null; sDraft = null; shuffleDraft = null;
    savePayload({ buckets: config.buckets, items: config.items, kappaTarget: kt, specificTarget: st, shuffle: config.shuffle, version: contentVersion, updatedAt: contentUpdatedAt });
    render();
  }
  function resetContent() {
    config = clone(DEFAULT_CONFIG);
    contentVersion = (contentVersion || 0) + 1;
    contentUpdatedAt = new Date().toISOString();
    contentDraft = null; kDraft = null; sDraft = null; shuffleDraft = null; contentError = null; contentWarning = null;
    savePayload({ buckets: config.buckets, items: config.items, kappaTarget: config.kappaTarget, specificTarget: config.specificTarget, shuffle: config.shuffle, version: contentVersion, updatedAt: contentUpdatedAt });
    render();
  }
  function renderContent() {
    var wrap = el("div", { class: "wrap wide" });
    wrap.appendChild(el("h2", { text: "Content" }));
    wrap.appendChild(el("p", { class: "lede", text: "The buckets and the queries to sort. Every save becomes a new version, and each session records which version it ran against. Changing content between the two sorts breaks the comparison, so edit before the first participant, not between them." }));
    if (ledgerDocs.length) wrap.appendChild(el("div", { class: "banner warn", text: "There are already " + plural(ledgerDocs.length, "session") + " in the ledger. Saving now creates version " + (contentVersion + 1) + ", and any new sort will not be comparable with them." }));
    if (contentError) wrap.appendChild(el("div", { class: "banner fail", role: "alert", text: contentError }));
    if (contentWarning) wrap.appendChild(el("div", { class: "banner warn", text: contentWarning }));
    var card = el("div", { class: "card" });
    var shown = contentDraft != null ? contentDraft : JSON.stringify({ buckets: config.buckets, items: config.items }, null, 2);
    card.appendChild(el("label", { class: "field" }, [el("span", { text: "Buckets and items (JSON). Each item’s “analyst” is the draft classification being tested; participants never see it. An optional \u201Cgloss\u201D (English translation) and \u201Clanguage\u201D are shown under the query." }),
      el("textarea", { class: "json", spellcheck: "false", value: shown, oninput: function (e) { contentDraft = e.target.value; } })]));
    card.appendChild(el("div", { class: "row" }, [
      el("label", { class: "field grow" }, [el("span", { text: "Kappa target (substantial agreement starts at 0.61)" }), el("input", { type: "number", step: "0.01", min: "0.01", max: "0.99", value: kDraft != null ? kDraft : config.kappaTarget, oninput: function (e) { kDraft = e.target.value; } })]),
      el("label", { class: "field grow" }, [el("span", { text: "Specific agreement target per bucket (0 to 1)" }), el("input", { type: "number", step: "0.05", min: "0.05", max: "1", value: sDraft != null ? sDraft : config.specificTarget, oninput: function (e) { sDraft = e.target.value; } })])]));
    card.appendChild(el("label", { class: "check" }, [el("input", { type: "checkbox", checked: shuffleDraft != null ? shuffleDraft : config.shuffle, onchange: function (e) { shuffleDraft = e.target.checked; } }), el("span", { text: "Shuffle the query order for each participant (recommended, so order effects do not line up between raters)" })]));
    card.appendChild(el("div", { class: "row between" }, [
      el("span", { class: "small muted", text: "Version " + contentVersion + (contentUpdatedAt ? ", saved " + contentUpdatedAt.slice(0, 16).replace("T", " ") : ", built-in default") }),
      el("div", { class: "row" }, [el("button", { class: "btn", text: "Reset to default", onclick: resetContent }), el("button", { class: "btn primary", text: "Save new version", onclick: saveContent })])]));
    wrap.appendChild(card);

    wrap.appendChild(el("h3", { text: "Coverage of the draft" }));
    var counts = {}, src = { head: 0, zero: 0, tail: 0 };
    config.items.forEach(function (it) { counts[it.analyst || "(none)"] = (counts[it.analyst || "(none)"] || 0) + 1; if (src[it.source] != null) src[it.source]++; });
    var tb = el("tbody");
    config.buckets.forEach(function (b) { tb.appendChild(el("tr", {}, [el("td", { text: b.code + " " + b.name }), el("td", { class: "num", text: String(counts[b.code] || 0) })])); });
    wrap.appendChild(el("div", { class: "tablewrap" }, [el("table", {}, [el("thead", {}, [el("tr", {}, [el("th", { text: "Bucket" }), el("th", { class: "num", text: "Queries in sample" })])]), tb])]));
    wrap.appendChild(el("p", { class: "small muted", text: "Sources: " + src.head + " from the head of the GA4 export, " + src.zero + " from the zero-result list, " + src.tail + " from the long tail. Buckets K, M and N have little or no head volume, so their items come from the zero-result list and the long tail. They are in the sample to test whether the definitions can be applied, not to say how common those queries are." }));
    return wrap;
  }

  // ---------- Shortcuts ----------
  function isParticipantScreen() {
    return (phase === "brief" || phase === "sorting" || phase === "review") && view === "session";
  }
  function renderShortcuts() {
    var codes = config.buckets.map(function (b) { return b.code; });
    var range = codes.length > 1 ? codes[0] + " to " + codes[codes.length - 1] : codes[0];
    var body;
    if (isParticipantScreen()) {
      body = [
        el("dl", {}, [
          el("dt", { text: range }), el("dd", { text: "Choose that bucket" }),
          el("dt", { text: "0" }), el("dd", { text: NONE_LABEL }),
          el("dt", { text: "Enter" }), el("dd", { text: "Next query" }),
          el("dt", { text: "\u2190" }), el("dd", { text: "Previous query" }),
          el("dt", { text: "?" }), el("dd", { text: "Show or hide this panel" }),
          el("dt", { text: "Esc" }), el("dd", { text: "Close this panel" })]),
        el("p", { class: "small muted", text: "These work on the query screen. Typing in the notes box works as normal." })];
    } else {
      body = [
        el("dl", {}, [
          el("dt", { text: "1" }), el("dd", { text: "Session tab" }), el("dt", { text: "2" }), el("dd", { text: "Ledger tab" }), el("dt", { text: "3" }), el("dd", { text: "Content tab" }),
          el("dt", { text: "?" }), el("dd", { text: "This panel" }), el("dt", { text: "Esc" }), el("dd", { text: "Close menus" })]),
        el("p", { class: "small muted", text: "While sorting: a bucket\u2019s letter chooses it, 0 is \u201C" + NONE_LABEL + "\u201D, Enter is next, left arrow is back." })];
    }
    return el("aside", { class: "shortcuts-panel", role: "dialog", "aria-label": "Keyboard shortcuts" }, [el("strong", { text: "Keyboard shortcuts" })].concat(body));
  }

  // ---------- Render ----------
  var lastPhaseKey = "";
  function render() {
    var app = document.getElementById("app");
    var activeId = document.activeElement && document.activeElement.id;
    app.innerHTML = "";
    app.appendChild(renderHeader());
    var body;
    if (view === "ledger") body = renderLedger();
    else if (view === "content") body = renderContent();
    else if (phase === "brief") body = renderBrief();
    else if (phase === "sorting") body = renderSorting();
    else if (phase === "review") body = renderReview();
    else if (phase === "debrief") body = renderDebrief();
    else if (phase === "done") body = renderDone();
    else body = renderSetup();
    var key = view + ":" + phase;
    var main = el("main", { class: key !== lastPhaseKey ? "phase-enter" : "" }, [body]);
    lastPhaseKey = key;
    app.appendChild(main);
    if (showShortcuts) app.appendChild(renderShortcuts());
    if (activeId === "note-input") { var n = document.getElementById("note-input"); if (n) n.focus(); }
  }

  document.addEventListener("click", function () { if (exportOpen) { exportOpen = null; render(); } });
  document.addEventListener("keydown", function (e) {
    var t = e.target, typing = t && (t.tagName === "INPUT" && t.type === "text" || t.tagName === "TEXTAREA" || t.tagName === "SELECT");
    if (e.key === "Escape") { if (exportOpen || showShortcuts) { exportOpen = null; showShortcuts = false; render(); } return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (view === "session" && phase === "sorting") {
      if (typing) { if (e.key === "Enter" && t.id === "note-input") { e.preventDefault(); next(); } return; }
      if (e.key === "?") { showShortcuts = !showShortcuts; render(); e.preventDefault(); return; }
      var k = e.key.toUpperCase();
      if (k === "0") { selectBucket(NONE); e.preventDefault(); return; }
      if (k.length === 1 && bucketByCode(k)) { selectBucket(k); e.preventDefault(); return; }
      if (e.key === "Enter") { next(); e.preventDefault(); return; }
      if (e.key === "ArrowLeft") { back(); e.preventDefault(); }
      return;
    }
    if (typing) return;
    if (isParticipantScreen()) {
      if (e.key === "?") { showShortcuts = !showShortcuts; render(); }
      return;
    }
    if (e.key === "1") { view = "session"; render(); }
    else if (e.key === "2") { view = "ledger"; refreshLocalLedgerIfLocal(); render(); }
    else if (e.key === "3") { view = "content"; render(); }
    else if (e.key === "?") { showShortcuts = !showShortcuts; render(); }
  });

  // Self-test hook for the moderator console: window.__querySortingStats(pairs)
  window.__querySortingStats = { cohen: cohen, bootstrapKappa: bootstrapKappa };

  // Follow the viewer's own choice when the host has set one, otherwise the system setting.
  var hostTheme = document.documentElement.getAttribute("data-theme");
  if (hostTheme === "dark" || hostTheme === "light") theme = hostTheme;
  else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
  document.documentElement.setAttribute("data-theme", theme);
  initCapabilities();
  render();
})();
</script>
</body>
</html>
